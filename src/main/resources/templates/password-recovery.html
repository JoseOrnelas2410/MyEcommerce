<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Recovery | MyECommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div th:replace="~{fragments/redirect-message :: redirect-message}"></div>
<div class="form-data-container">
    <div class="auth-data">
        <h3>MyECommerce</h3>
        <p>PASSWORD RECOVERY</p>
    </div>
    <form th:action="@{/password_recovery}"
          class="auth-form"
          method="post">
        <div class="auth-input-label">
            <label>E-Mail</label>
            <input type="email" name="mail" placeholder="E-mail" required>
        </div>
        <div th:replace="~{/fragments/buttons :: action-button('RECOVER PASSWORD','bi bi-envelope-at')}"></div>
    </form>
</div>
</body>
</html>
