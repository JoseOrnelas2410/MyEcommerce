<th:block th:fragment="paginator(
         url,
         currentPage,
         totalPages,
         isFirst,
         isLast,
         hasPrevious,
         hasNext,
         category)"><!--Necesario para que si navegamos con filtro no se pierda-->
    <nav aria-label="Page navigation" th:if="${totalPages > 0}">
        <ul class="pagination justify-content-center align-items-center">

            <li class="page-item" th:classappend="${isFirst} ? 'disabled'">
                <a class="page-link" th:href="@{${url}(page=0)(category=${category})}">First</a>
            </li>

            <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{${url}(page=${currentPage - 1})(category=${category})}">Previous</a>
            </li>

            <li class="page-item disabled">
                <span class="page-link" th:text="|Page ${currentPage + 1} of ${totalPages}|"></span>
            </li>

            <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{${url}(page=${currentPage + 1})(category=${category})}">Next</a>
            </li>

            <li class="page-item" th:classappend="${isLast} ? 'disabled'">
                <a class="page-link" th:href="@{${url}(page=${totalPages - 1})(category=${category})}">Last</a>
            </li>
        </ul>
    </nav>
</th:block>
