<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- Fragmento para el botón de navegación -->
<th:block th:fragment="navbar-button(iconRoute,text,url)">
    <a th:href="@{${url}}" class="nav-item">
        <i th:class="${iconRoute}"></i>
        <span th:text="${text}">Default Text</span>
    </a>
</th:block>

<!-- Fragmento para la barra de navegación -->
<th:block th:fragment="navbar">
    <nav class="nav-bar">
        <div class="nav-bar-items-container">
            <th:block sec:authorize="hasAuthority('ROLE_CUSTOMER')">
                <div th:replace="~{fragments/navbar :: navbar-button('bi bi-person', 'PROFILE', '/customer/profile')}"></div>
                <div th:replace="~{fragments/navbar :: navbar-button('bi bi-shop-window','CATALOGUE','/customer/catalogue')}"></div>
                <div th:replace="~{fragments/navbar :: navbar-button('bi bi-cart4','CART','/customer/shopping_cart')}"></div>
                <div th:replace="~{fragments/navbar :: navbar-button('bi bi-bag-check','ORDERS','/customer/orders')}"></div>
            </th:block>
            <th:block sec:authorize="hasAuthority('ROLE_ADMIN')">
                <div th:replace="~{fragments/navbar :: navbar-button('bi bi-person', 'PROFILE', '/admin/profile')}"></div>
                <div th:replace="~{fragments/navbar :: navbar-button('bi bi-shop-window','CATALOGUE','/admin/catalogue')}"></div>
                <div th:replace="~{fragments/navbar :: navbar-button('bi bi-bag-check','ORDERS','/admin/orders')}"></div>
                <div th:replace="~{fragments/navbar :: navbar-button('bi bi-clipboard-data','REPORTS','/admin/reports')}"></div>
            </th:block>
        </div>
    </nav>
</th:block>
</body>
</html>
