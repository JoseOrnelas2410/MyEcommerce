<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | MyECommerce</title>
</head>
<body>

<div th:if="${param.success}" style="color: green; margin-bottom: 10px;">
    ¡Registro completado! Por favor, inicia sesión.
</div>

<form th:action="@{/login}" method="post">
    <div>
        <input type="email" name="username" placeholder="E-mail" required>
        <input type="password" name="password" placeholder="Password" required>
        <div th:replace="~{/fragments/buttons :: action-button('LOGIN','bi bi-box-arrow-in-right')}"></div>
    </div>
</form>
<p>Not registered yet? <a href="/register"> Create an account.</a></p>
<p>Forgot your password? <a href="/password_recovery"> Recover it.</a></p>

</body>
</html>
