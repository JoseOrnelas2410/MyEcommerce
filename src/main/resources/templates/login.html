<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | MyECommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div th:replace="~{fragments/redirect-message :: redirect-message}"></div>
    <div class="form-data-container">
        <form th:action="@{/login}"
              class="auth-form"
              method="post">
                <div class="auth-input-label">
                    <label>Email</label>
                    <input type="email"
                           name="username"
                           placeholder="E-mail"
                           required>
                </div>
                <div class="auth-input-label">
                    <label>Password</label>
                    <input type="password"
                           name="password"
                           placeholder="Password"
                           required>
                </div>
                <div th:replace="~{/fragments/buttons :: action-button('LOGIN','bi bi-box-arrow-in-right')}"></div>
                <p class="text-with-link">Not registered yet? <a href="/register"> Create an account.</a></p>
                <p class="text-with-link">Forgot your password? <a href="/password_recovery"> Recover it.</a></p>
        </form>
        <div class="auth-data">
            <h3>MyECommerce</h3>
            <p>LOGIN</p>
        </div>
    </div>
</body>
</html>
