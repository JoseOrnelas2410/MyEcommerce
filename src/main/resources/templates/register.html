<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | MyECommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div th:replace="~{fragments/redirect-message :: redirect-message}"></div>
    <div class="form-data-container">
        <div class="auth-data">
            <h3>MyECommerce</h3>
            <p>REGISTER</p>
        </div>
        <form th:action="@{/register}"
              th:object="${customer}"
              class="auth-form"
              method="post">
            <div class="auth-input-label">
                <label>Name</label>
                <input type="text"
                       placeholder="Name"
                       th:field="*{name}"
                       required>
            </div>
            <div class="auth-input-label">
                <label>FirstName</label>
                <input type="text"
                       placeholder="FirstName"
                       th:field="*{firstName}"
                       required>
            </div>
            <div class="auth-input-label">
                <label>Mail</label>
                <input type="email"
                       placeholder="Email"
                       th:field="*{email}"
                       required>
            </div>

            <div class="auth-input-label">
                <label>Phone</label>
                <input type="number"
                       placeholder="Phone Number"
                       th:field="*{phone}" required>
            </div>

            <div class="auth-input-label">
                <label>Address</label>
                <input type="text"
                       placeholder="Address"
                       th:field="*{userAddress}"
                       required>
            </div>

            <div class="auth-input-label">
                <label>Password</label>
                <input type="password"
                       placeholder="*******"
                       th:field="*{password}" required>
            </div>
            <div th:replace="~{fragments/buttons :: action-button('REGISTER','bi bi-person-fill-add')}"></div>
            <p class="text-with-link">Already have an account?<a href="/login"> Login.</a></p>
        </form>
    </div>
</body>
</html>
