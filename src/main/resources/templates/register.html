<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | MyECommerce</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<form th:action="@{/register}" th:object="${customer}" method="post">
    <div>
        <div>
            <label>Name:</label>
            <input type="text" th:field="*{name}" required>
        </div>

        <div>
            <label>FirstName:</label>
            <input type="text" th:field="*{firstName}" required>
        </div>

        <div>
            <label>E-mail:</label>
            <input type="email" th:field="*{email}" required>
        </div>

        <div>
            <label>Phone:</label>
            <input type="number" th:field="*{phone}" required>
        </div>

        <div>
            <label>Address:</label>
            <input type="text" th:field="*{userAddress}" required>
        </div>

        <div>
            <label>Contraseña:</label>
            <input type="password" th:field="*{password}" required>
        </div>
        <div th:replace="~{fragments/buttons :: action-button('REGISTER','bi bi-person-fill-add')}"></div>
    </div>
</form>

</body>
</html>
