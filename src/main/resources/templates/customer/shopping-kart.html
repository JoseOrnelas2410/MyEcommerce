<section layout:decorate="~{layouts/main-layout}"
         xmlns:th="http://www.thymeleaf.org"
         xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <div layout:fragment="content">
        <link rel="stylesheet" th:href="@{/css/customer-shopping-cart.css}">
        <div class="customer-page-header">
            <i class="bi bi-person-bounding-box"></i>
            <div class="customer-header-data">
                <h1 th:text="${name}"></h1>
                <h2 th:text="${email}"></h2>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(cart)}">
            <p>Your cart is empty, please add products to your shopping kart</p>
        </div>
        <div th:unless="${#lists.isEmpty(cart)}">
            <form th:action="@{/customer/create_order}" method="post">
                <div th:replace="~{fragments/buttons :: action-button('PAY ORDER','bi bi-credit-card')}">
                    Boton que generara mi orden
                </div>
            </form>
            <div class="shopping-cart-content">
                <div th:each="product : ${cart}"
                    class="shopping-cart-item">
                    <img th:src="@{|/images/products/${product.getImageName()}|}"
                         alt="ProductImage">
                    <div class="shopping-cart-item-data">
                        <p th:text="${product.getProductName()}" class="shopping-cart-item-name"></p>
                        <p th:text="${product.getCategory()}" class="outlined-container"></p>
                        <div class="shopping-cart-item-price-container">
                            <p class="price-tag">Price</p>
                            <p th:text="${product.getPrice()}" class="ammount"></p>
                        </div>
                        <form th:action="@{/customer/update_quantity}">
                            <input type="hidden" name="id" th:value="${product.getProductId()}">
                            <div class="quantity-selector-container">
                                <button type="submit"
                                        name="action"
                                        value="decrease"
                                        class="quantity-selector-minus"
                                >
                                    -
                                </button>
                                <p class="qty-input"
                                   th:text="${product.getQuantity()}">
                                    quantity
                                </p>
                                <button type="submit"
                                        name="action"
                                        value="increase"
                                        class="quantity-selector-plus"
                                >
                                    +
                                </button>
                            </div>
                        </form>
                        <div th:replace="~{/fragments/buttons ::navigation-button('/customer/remove_fsc?id=' + ${product.productId},'REMOVE PRODUCT','bi bi-trash')}"></div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
