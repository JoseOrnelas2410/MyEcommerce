<section layout:decorate="~{layouts/main-layout}"
         xmlns:th="http://www.thymeleaf.org"
         xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <div layout:fragment="content">
        <div class="customer-page">
            <div class="customer-page-header">
                <i class="bi bi-person-bounding-box"></i>
                <div class="customer-header-data">
                    <h1 th:text="${name}"></h1>
                    <h2 th:text="${email}"></h2>
                    <div th:unless="${#lists.isEmpty(cart)}">
                        <div class="price-container">
                            <p class="price-tag">Total+IVA</p>
                            <p th:text="'$' + ${total}" class="ammount">$0.00</p>
                        </div>
                        <form th:action="@{/customer/create_order}"
                              class="customer-header-button"
                              method="post">
                            <div th:replace="~{fragments/buttons :: action-button('PAY ORDER','bi bi-credit-card')}"></div>
                        </form>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(cart)}">
                <p>Your cart is empty, please add products to your shopping kart</p>
            </div>
            <div th:unless="${#lists.isEmpty(cart)}" class="cart-content">
                <div class="horizontal-separator">
                    <div class="horizontal-line"></div>
                    <p>YOUR CART</p>
                    <div class="horizontal-line"></div>
                </div>
                <div th:each="product : ${cart}"
                     class="cart-item">
                    <img th:src="@{|/images/products/${product.getImageName()}|}"
                         alt="ProductImage">
                    <div class="cart-item-data">
                        <p th:text="${product.getProductName()}" class="cart-item-name"></p>
                        <div class="cart-item-outlined-text">
                            <p th:text="${product.getCategory()}" class="outlined-container"></p>
                        </div>
                        <div class="price-container">
                            <p class="price-tag">Price</p>
                            <p th:text="${product.getPrice()}" class="ammount"></p>
                        </div>
                        <form th:action="@{/customer/update_quantity}"
                              class="cart-item-quantity-selector">
                            <input type="hidden" name="id" th:value="${product.getProductId()}">
                            <div class="quantity-selector">
                                <button type="submit"
                                        name="action"
                                        value="decrease"
                                >
                                    -
                                </button>
                                <p class="qty-input"
                                   th:text="${product.getQuantity()}">
                                    quantity
                                </p>
                                <button type="submit"
                                        name="action"
                                        value="increase"
                                >
                                    +
                                </button>
                            </div>
                        </form>
                        <div class="cart-item-button">
                            <div th:replace="~{/fragments/buttons ::navigation-button('/customer/remove_fsc?id=' + ${product.productId},'REMOVE PRODUCT','bi bi-trash')}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
