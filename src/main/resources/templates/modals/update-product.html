<div th:fragment="modal-update-product(productTypeList)"
     class="modal fade"
     id="updateProductModal"
     tabindex="-1">
    <!--Aqui importamos mi css especifico para este modal-->
    <link rel="stylesheet" th:href="@{/css/update-product-modal.css}">

    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header-update-product"  >
                <img
                        id="imagePreview"
                        src=""
                        alt="imageProduct"
                        class="update-product-img"
                >

                <h5 class="modal-update-product-title" id="id"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body-update-product">
                <form
                        th:action="@{/admin/update_product}"
                        th:object="${addProductDto}"
                        enctype="multipart/form-data"
                        method="post"
                >
                    <input type="text" name="id" id="updateProductID" hidden>
                    <div>

                        <label>ProductImage
                            <p id="updateProductImage"></p>
                            <input type="file" name="image">
                        </label>
                    </div>

                    <div>
                        <label>Name
                            <input type="text" name="name" id="updateProductName" required>
                        </label>
                    </div>

                    <div>
                        <label>Price
                            <input type="number" step=".01" name="price" id="updateProductPrice" required>
                        </label>
                    </div>

                    <div>
                        <label>Stock
                            <input type="number" step="1" name="stock" id="updateProductStock" required>
                        </label>
                    </div>

                    <div>
                        <label>ProductType
                            <select name="productTypeId" id="updateProductTypeId" class="form-select" required>
                                <option value="${product.productType.productTypeDescription}" selected></option>
                                <option th:each="entry : ${typeList.entrySet()}"
                                        th:value="${entry.key}"
                                        th:text="${entry.value}"></option>
                            </select>
                        </label>
                    </div>

                    <div>
                        <label>Is active?
                            <select name="active" id="updateProductIsActive" class="form-select" required>
                                <option value="true" selected>Active/Show</option>
                                <option value="false">Not Active/Hidden</option>
                            </select>
                        </label>
                    </div>

                    <div class="modal-footer">
                        <div th:replace="~{/fragments/buttons :: action-button('SAVE CHANGES','bi bi-floppy')}"></div>
                    </div>
                </form>
            </div>
        </div>
        <script th:src="@{/js/image-update.js}"></script>
    </div>
</div>
